<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shell</title>
<link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:0;background:var(--surface-page)}.wrap{display:grid;grid-template-columns:232px 1fr 300px;height:400px}.pane{padding:18px 20px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--border-hairline)}.phone{width:250px;border:1px solid var(--border-subtle);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:150px;background:var(--surface-page)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { ConsoleNav, WalletControl, StrategyBadge, Wordmark, Sheet, AmountField, Button } = window.VeilSaveDesignSystem_484fa6;
const items = [{id:"pool",label:"Pool",icon:"grid-2x2"},{id:"dashboard",label:"Dashboard",icon:"vault"},{id:"draws",label:"Draws",icon:"dices"}];
function ShellCard(){
  const [open, setOpen] = React.useState(false);
  const [amt, setAmt] = React.useState("500.000000");
  return <div className="wrap">
    <ConsoleNav items={items} active="dashboard" secondary={[{id:"privacy",label:"Privacy",icon:"lock"}]}
      footer={<><StrategyBadge mode="test" size="sm" /><WalletControl state="connected" address="0x8f21c4b70a5519d3ff04c7" network="Sepolia" compact /></>} />
    <div className="pane" style={{borderLeft:"none"}}>
      <Wordmark size={24} mark />
      <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"flex-start"}}>
        <WalletControl state="disconnected" />
        <WalletControl state="wrongNetwork" network="Sepolia" />
        <WalletControl state="connected" address="0x8f21c4b70a5519d3ff04c7" />
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}><StrategyBadge mode="test" /><StrategyBadge mode="live" withHint={false} /></div>
      <Button tone="secondary" size="sm" onClick={() => setOpen(true)}>Open deposit sheet</Button>
      <Sheet open={open} eyebrow="Deposit" title="Save cUSDT" onClose={() => setOpen(false)}
        footer={<Button tone="primary" size="lg" block icon="lock">Encrypt and deposit</Button>}>
        <AmountField value={amt} onChange={setAmt} max="2,400.000000" helper="Encrypted in your browser before it is submitted." />
      </Sheet>
    </div>
    <div className="pane">
      <span className="vs-label">Mobile navigation</span>
      <div className="phone">
        <div style={{flex:1,padding:12}}><span className="vs-body-sm">360px viewport</span></div>
        <ConsoleNav variant="bottom" items={items} active="draws" />
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<ShellCard />);
</script></body></html>

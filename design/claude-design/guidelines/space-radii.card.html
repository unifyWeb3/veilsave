<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="2 · 4 · 6 · 8 · pill — nothing rounder than 8px" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px;background:var(--surface-page)}.r{display:flex;gap:14;align-items:flex-end}.c{width:76px;height:56px;background:var(--surface-raised);border:1px solid var(--border-subtle)}</style>
</head><body>
<div class="r">
<div style="display:flex;flex-direction:column;gap:7"><div class="c" style="border-radius:var(--r-xs)"></div><span class="vs-mono-sm" style="color:var(--text-faint)">2px</span><span class="vs-micro" style="max-width:76px">Nodes, ticks, badges</span></div><div style="display:flex;flex-direction:column;gap:7"><div class="c" style="border-radius:var(--r-sm)"></div><span class="vs-mono-sm" style="color:var(--text-faint)">4px</span><span class="vs-micro" style="max-width:76px">Inputs, icon buttons</span></div><div style="display:flex;flex-direction:column;gap:7"><div class="c" style="border-radius:var(--r-md)"></div><span class="vs-mono-sm" style="color:var(--text-faint)">6px</span><span class="vs-micro" style="max-width:76px">Buttons, banners, rows</span></div><div style="display:flex;flex-direction:column;gap:7"><div class="c" style="border-radius:var(--r-lg)"></div><span class="vs-mono-sm" style="color:var(--text-faint)">8px</span><span class="vs-micro" style="max-width:76px">Cards, sheets, panels</span></div>
<div style="display:flex;flex-direction:column;gap:7"><div class="c" style="border-radius:var(--r-pill);width:56px"></div><span class="vs-mono-sm" style="color:var(--text-faint)">pill</span><span class="vs-micro">Status only</span></div>
</div></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px;background:var(--surface-page)}.r{display:flex;align-items:center;gap:34;flex-wrap:wrap}.wm{font-family:var(--font-sans);letter-spacing:.02em;white-space:nowrap}.wm b{font-weight:600}.wm i{font-style:normal;font-weight:500;color:var(--text-muted)}.glyph{width:22px;height:22px;border-radius:var(--r-xs);border:1px solid var(--border-private);background:var(--wash-private);display:grid;place-items:center}.glyph span{width:4px;height:4px;border-radius:1px;background:var(--teal-500);box-shadow:0 0 0 4px var(--wash-verified)}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:16">
<div class="r">
<span class="wm" style="font-size:34px"><i>veil</i><b>Save</b></span>
<span style="display:inline-flex;align-items:center;gap:10"><span class="glyph"><span></span></span><span class="wm" style="font-size:20px"><i>veil</i><b>Save</b></span></span>
<span class="wm" style="font-size:15px;color:var(--text-secondary)"><i>veil</i><b>Save</b></span>
</div>
<p class="vs-body-sm" style="margin:0;max-width:62ch"><code class="vs-mono">veil</code> sits at 500 in muted ink, <code class="vs-mono">Save</code> at 600 in primary: the emphasis belongs on what the user keeps. Minimum size 13px; clear space equals the cap height on all sides.</p>
</div></body></html>

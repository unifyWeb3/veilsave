<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Surface value and hairlines first; glow only where the protocol changed state" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px;background:var(--surface-page)}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:12}.c{height:76px;border-radius:var(--r-lg);display:grid;place-items:center;text-align:center;padding:0 8px}</style>
</head><body>
<div class="r">
<div style="display:flex;flex-direction:column;gap:7"><div class="c" style="background:var(--surface-inset);border:1px solid var(--border-hairline)"><span class="vs-micro">Inset · fields, wells</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">DARKER, NOT LIFTED</span></div>
<div style="display:flex;flex-direction:column;gap:7"><div class="c" style="background:var(--surface-raised);border:1px solid var(--border-hairline);box-shadow:var(--sheen-top),var(--shadow-panel)"><span class="vs-micro">Panel · records, tools</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">--SHADOW-PANEL</span></div>
<div style="display:flex;flex-direction:column;gap:7"><div class="c" style="background:var(--surface-overlay);border:1px solid var(--border-subtle);box-shadow:var(--shadow-overlay)"><span class="vs-micro">Overlay · dialog, sheet</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">--SHADOW-OVERLAY</span></div>
<div style="display:flex;flex-direction:column;gap:7"><div class="c" style="background:var(--wash-verified);border:1px solid var(--border-verified);box-shadow:var(--glow-verified)"><span class="vs-micro" style="color:var(--text-verified)">Glow · state changed</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">--GLOW-VERIFIED</span></div>
</div></body></html>

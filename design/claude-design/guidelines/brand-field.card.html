<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The field</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:0;background:var(--surface-page)}.wrap{position:relative;height:240px;overflow:hidden}.copy{position:relative;padding:22px;display:flex;flex-direction:column;gap:10;max-width:44ch}</style>
</head><body>
<div class="wrap vs-field">
<div class="copy">
<span class="vs-label" style="color:var(--text-private)">Field</span>
<p class="vs-body-sm" style="margin:0">The same 64px geometry the 16-slot grid uses, masked from the top and never above 7% opacity behind copy. One privacy wash top-left, one verification wash bottom-right, one depth wash pulling the brand navy up through the page.</p>
<div style="display:flex;gap:10;flex-wrap:wrap;margin-top:4px">
<span class="vs-mono-sm" style="color:var(--text-faint);border:1px solid var(--border-hairline);border-radius:var(--r-xs);padding:3px 7px">.vs-field</span>
<span class="vs-mono-sm" style="color:var(--text-faint);border:1px solid var(--border-hairline);border-radius:var(--r-xs);padding:3px 7px">--field-cell 64px</span>
<span class="vs-mono-sm" style="color:var(--text-faint);border:1px solid var(--border-hairline);border-radius:var(--r-xs);padding:3px 7px">.vs-field-flat</span>
</div>
</div>
</div></body></html>

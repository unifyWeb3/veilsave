<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Panels</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px;background:var(--surface-page)}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:14}.p{height:92px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}</style>
</head><body>
<div class="r">
<div style="display:flex;flex-direction:column;gap:7"><div class="p vs-panel-quiet"><span class="vs-micro" style="color:var(--text-secondary)">Quiet</span><span class="vs-body-sm" style="margin:0">Grouping only — a diagram or a ruled list.</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">.VS-PANEL-QUIET</span></div>
<div style="display:flex;flex-direction:column;gap:7"><div class="p vs-panel"><span class="vs-micro" style="color:var(--text-secondary)">Panel</span><span class="vs-body-sm" style="margin:0">The default. Hairline, sheen, one low wide shadow.</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">.VS-PANEL</span></div>
<div style="display:flex;flex-direction:column;gap:7"><div class="p vs-panel-lifted"><span class="vs-micro" style="color:var(--text-secondary)">Lifted</span><span class="vs-body-sm" style="margin:0">Anchors a view — the position band.</span></div><span class="vs-mono-sm" style="color:var(--text-faint)">.VS-PANEL-LIFTED</span></div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Status washes" subtitle="9% wash + 36% border — the only way status tints a surface" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Washes</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px;background:var(--surface-page)}.r{display:grid;grid-template-columns:repeat(5,1fr);gap:10}.w{height:60px;border-radius:var(--r-md);display:grid;place-items:center}</style>
</head><body>
<div class="r">
<div class="w" style="background:var(--wash-neutral);border:1px solid var(--border-hairline)"><span class="vs-micro" style="color:var(--text-secondary)">Neutral</span></div><div class="w" style="background:var(--wash-private);border:1px solid var(--border-private)"><span class="vs-micro" style="color:var(--text-private)">Encrypted</span></div><div class="w" style="background:var(--wash-verified);border:1px solid var(--border-verified)"><span class="vs-micro" style="color:var(--text-verified)">Verified</span></div><div class="w" style="background:var(--wash-pending);border:1px solid var(--border-pending)"><span class="vs-micro" style="color:var(--text-pending)">Pending</span></div><div class="w" style="background:var(--wash-critical);border:1px solid var(--border-critical)"><span class="vs-micro" style="color:var(--text-critical)">Failed</span></div>
</div></body></html>

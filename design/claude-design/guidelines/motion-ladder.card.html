<!-- @dsCard group="Motion" viewport="700x180" name="Duration & easing" subtitle="Seven durations, five curves — motion explains state, never decorates" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Motion ladder</title>
<link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 18px;background:var(--surface-page)}.l{display:grid;grid-template-columns:120px 1fr 130px;gap:12px;align-items:center;padding:6px 0}.tr{height:3px;background:var(--slot-empty);border-radius:2px;overflow:hidden}.tr i{display:block;height:100%;background:var(--periwinkle-500);border-radius:2px;animation:grow 3.2s var(--ease-standard) infinite}@keyframes grow{0%{width:0}70%{width:100%}100%{width:100%}}</style>
</head><body>
<div>
<div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">90ms · instant</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0s"></i></div><span class="vs-micro">Press, tooltip</span></div><div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">140ms · fast</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0.08s"></i></div><span class="vs-micro">Hover, focus</span></div><div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">220ms · base</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0.16s"></i></div><span class="vs-micro">Rows, panels, chips</span></div><div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">380ms · slow</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0.24s"></i></div><span class="vs-micro">Dialog and sheet</span></div><div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">640ms · deliberate</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0.32s"></i></div><span class="vs-micro">Encryption, verification</span></div><div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">900ms · reveal</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0.4s"></i></div><span class="vs-micro">Prize reveal</span></div><div class="l"><span class="vs-mono-sm" style="color:var(--text-secondary)">1400ms · epoch</span><div class="tr"><i style="animation-duration:3.2s;animation-delay:0.48s"></i></div><span class="vs-micro">Epoch and draw progression</span></div>
</div></body></html>
